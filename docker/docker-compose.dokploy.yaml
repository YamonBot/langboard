name: ${PROJECT_NAME:-langboard}

x-langboard-env: &langboard-env
  ENVIRONMENT: production
  PROJECT_NAME: ${PROJECT_NAME:-langboard}
  PROJECT_SHORT_NAME: ${PROJECT_SHORT_NAME:-lb}
  PUBLIC_UI_URL: ${PUBLIC_UI_URL:-https://${DOMAIN}}
  API_URL: ${API_URL:-/api}
  SOCKET_URL: ${SOCKET_URL:-/socket}
  API_HOST: api
  API_PORT: ${API_PORT:-5381}
  SOCKET_HOST: socket
  SOCKET_PORT: ${SOCKET_PORT:-5690}
  FLOWS_HOST: flows
  FLOWS_PORT: ${FLOWS_PORT:-5019}
  MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
  AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-120}
  AI_REQUEST_TRIALS: ${AI_REQUEST_TRIALS:-5}
  TERMINAL_LOGGING_LEVEL: ${TERMINAL_LOGGING_LEVEL:-INFO}
  FILE_LOGGING_LEVEL: ${FILE_LOGGING_LEVEL:-}
  LOGGING_DIR: ${LOGGING_DIR:-}
  SOCKET_LOGGING_DIR: ${SOCKET_LOGGING_DIR:-}
  MAIN_DATABASE_URL: ${POSTGRES_EXTERNAL_MAIN_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-langboard}}
  READONLY_DATABASE_URL: ${POSTGRES_EXTERNAL_REPLICA_URL:-${POSTGRES_EXTERNAL_MAIN_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-langboard}}}
  DB_TIMEOUT: ${DB_TIMEOUT:-120}
  DB_TCP_USER_TIMEOUT: ${DB_TCP_USER_TIMEOUT:-1000}
  CACHE_TYPE: ${CACHE_TYPE:-in-memory}
  CACHE_URL: ${CACHE_URL:-}
  BROADCAST_TYPE: ${BROADCAST_TYPE:-in-memory}
  BROADCAST_URLS: ${BROADCAST_URLS:-}
  COMMON_SECRET_KEY: ${COMMON_SECRET_KEY:-langboard-secret-key}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-langboard-secret-key}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_AT_EXPIRATION: ${JWT_AT_EXPIRATION:-10800}
  JWT_RT_EXPIRATION: ${JWT_RT_EXPIRATION:-30}
  AUTH_PROVIDER: ${AUTH_PROVIDER:-hybrid}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
  OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
  OIDC_PROMPT: ${OIDC_PROMPT:-}
  OIDC_TIMEOUT_SEC: ${OIDC_TIMEOUT_SEC:-10}
  OIDC_DISCOVERY_CACHE_SEC: ${OIDC_DISCOVERY_CACHE_SEC:-3600}
  OIDC_JWKS_CACHE_TTL_SEC: ${OIDC_JWKS_CACHE_TTL_SEC:-3600}
  OIDC_CLOCK_SKEW_SEC: ${OIDC_CLOCK_SKEW_SEC:-60}
  SCIM_ENABLED: ${SCIM_ENABLED:-true}
  SCIM_BEARER_TOKEN: ${SCIM_BEARER_TOKEN:-}
  SCIM_ISSUER: ${SCIM_ISSUER:-https://${DOMAIN}}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_SERVER: ${MAIL_SERVER:-}
  MAIL_PORT: ${MAIL_PORT:-}
  MAIL_STARTTLS: ${MAIL_STARTTLS:-}
  MAIL_SSL_TLS: ${MAIL_SSL_TLS:-}
  DEFAULT_FLOWS_URL: ${DEFAULT_FLOWS_URL:-http://flows:${FLOWS_PORT:-5019}}
  UI_PORT: ${UI_PORT:-5173}
  DOMAIN: ${DOMAIN:-langboarddev.yamon.io}
  CRON_TAB_FILE: ${CRON_TAB_FILE:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_REGION_NAME: ${S3_REGION_NAME:-}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
  KEY_PROVIDER_TYPE: ${KEY_PROVIDER_TYPE:-openbao-local}
  KEY_PROVIDER_OPENBAO_URL: ${KEY_PROVIDER_OPENBAO_URL:-http://vault:8200}
  KEY_PROVIDER_OPENBAO_ROOT_TOKEN: ${KEY_PROVIDER_OPENBAO_ROOT_TOKEN:-}
  KEY_PROVIDER_HASHICORP_URL: ${KEY_PROVIDER_HASHICORP_URL:-}
  KEY_PROVIDER_HASHICORP_ROLE_ID: ${KEY_PROVIDER_HASHICORP_ROLE_ID:-}
  KEY_PROVIDER_HASHICORP_SECRET_ID: ${KEY_PROVIDER_HASHICORP_SECRET_ID:-}
  KEY_PROVIDER_AWS_REGION: ${KEY_PROVIDER_AWS_REGION:-}
  KEY_PROVIDER_AWS_ACCESS_KEY_ID: ${KEY_PROVIDER_AWS_ACCESS_KEY_ID:-}
  KEY_PROVIDER_AWS_SECRET_ACCESS_KEY: ${KEY_PROVIDER_AWS_SECRET_ACCESS_KEY:-}
  KEY_PROVIDER_AWS_KMS_KEY_ARN: ${KEY_PROVIDER_AWS_KMS_KEY_ARN:-}
  KEY_PROVIDER_AZURE_KEYVAULT_URL: ${KEY_PROVIDER_AZURE_KEYVAULT_URL:-}
  KEY_PROVIDER_AZURE_CLIENT_ID: ${KEY_PROVIDER_AZURE_CLIENT_ID:-}
  KEY_PROVIDER_AZURE_CLIENT_SECRET: ${KEY_PROVIDER_AZURE_CLIENT_SECRET:-}
  KEY_PROVIDER_AZURE_TENANT_ID: ${KEY_PROVIDER_AZURE_TENANT_ID:-}
  KEY_PROVIDER_AZURE_ENCRYPTION_KEY_NAME: ${KEY_PROVIDER_AZURE_ENCRYPTION_KEY_NAME:-}

services:
  vault:
    image: openbao/openbao:latest
    environment:
      BAO_LOCAL_CONFIG: >-
        {"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},
        "storage":{"file":{"path":"/openbao/file"}},
        "api_addr":"http://vault:8200","disable_mlock":true,"ui":true}
      PROJECT_NAME: ${PROJECT_NAME:-langboard}
    command: ["sh", "/entrypoint.sh"]
    volumes:
      - ./vault/entrypoint.dokploy.sh:/entrypoint.sh:ro
      - vault-file:/openbao/file
      - vault-init:/openbao/init
      - vault-creds:/vault-shared
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langboard}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langboard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: base
    environment:
      <<: *langboard-env
      WORKER: main
    command: >
      sh -lc "cp /vault-shared/.vault-credentials /app/.vault-credentials &&
      uv run --no-sync langboard db:up &&
      uv run --no-sync langboard run --workers ${API_WORKERS_COUNT:-2}"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - vault-creds:/vault-shared:ro
    restart: unless-stopped

  socket:
    build:
      context: ../src
      dockerfile: socket/Dockerfile
    environment:
      <<: *langboard-env
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - vault-creds:/vault-shared:ro
    restart: unless-stopped

  flows:
    build:
      context: ../src
      dockerfile: flows/Dockerfile
    working_dir: /app/src/flows
    environment:
      <<: *langboard-env
    command: >
      sh -lc "cp /vault-shared/.vault-credentials /app/.vault-credentials &&
      uv run --no-sync flows run --workers ${FLOWS_WORKERS_COUNT:-1}"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - vault-creds:/vault-shared:ro
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx-dokploy
      args:
        PUBLIC_UI_URL: ${PUBLIC_UI_URL:-https://${DOMAIN}}
        API_URL: ${API_URL:-/api}
        SOCKET_URL: ${SOCKET_URL:-/socket}
    environment:
      API_HOST: api
      API_PORT: ${API_PORT:-5381}
      SOCKET_HOST: socket
      SOCKET_PORT: ${SOCKET_PORT:-5690}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
    depends_on:
      - api
      - socket
    restart: unless-stopped

volumes:
  pgdata:
  vault-file:
  vault-init:
  vault-creds:
